<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RentInstead</title>

    <!-- <base href="../../"> -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'DM Sans', sans-serif;
            background: #f5f7fb;
            color: #172554;
        }

        .topbar {
            padding: 20px 6%;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #172554;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .brand-accent { color: #c2410c; }

        .page-content {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 35px 16px;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            box-shadow: 0 20px 60px #0f172a0b;
        }

        .reset-icon {
            display: grid;
            place-items: center;
            width: 66px;
            height: 66px;
            margin-bottom: 24px;
            border-radius: 18px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 28px;
        }

        h1 {
            margin-bottom: 10px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 32px;
            font-weight: 800;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            min-height: 50px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        .input-wrap:focus-within {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px #1d4ed81a;
        }

        .input-wrap i {
            padding-left: 14px;
            color: #64748b;
        }

        .input-wrap input {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 0;
            outline: 0;
            background: transparent;
            font: inherit;
        }

        .primary-btn {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #1d4ed8;
            color: white;
            font-weight: 700;
        }

        .primary-btn:hover { background: #1e40af; }

        .back-link {
            display: inline-block;
            margin-top: 23px;
            color: #1d4ed8;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
        }

        .security-note {
            display: flex;
            gap: 9px;
            margin-top: 22px;
            padding: 12px;
            border-radius: 9px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 12px;
            line-height: 1.6;
        }

        footer {
            padding: 18px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .reset-card { padding: 28px 22px; }
            h1 { font-size: 28px; }
            .topbar { padding: 16px 20px; }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/RentInstead/favicon.svg">
</head>

<body>
    <header class="topbar">
        <a href="../../index.html" class="brand">
            <span class="brand-icon"><i class="bi bi-house-heart-fill"></i></span>
            <span>Rent<span class="brand-accent">Instead</span></span>
        </a>
    </header>

    <main class="page-content">
        <section class="reset-card">
            <div class="reset-icon">
                <i class="bi bi-shield-lock"></i>
            </div>

            <h1>Forgot password?</h1>
            <p class="subtitle">
                Enter your registered mobile number to begin the password recovery process.
            </p>

            <form id="resetForm">
                <label for="phone" class="form-label">Registered phone number</label>

                <div class="input-wrap">
                    <i class="bi bi-telephone"></i>
                    <span class="ps-2 text-secondary">+91</span>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10-digit mobile number"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        maxlength="10"
                        pattern="[6-9][0-9]{9}"
                        required>
                </div>

                <button type="submit" class="primary-btn">
                    Continue <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div id="message" class="message" role="status"></div>

            <div class="security-note">
                <i class="bi bi-info-circle-fill"></i>
                <span>For your security, password recovery will be verified by the backend. No real OTP is sent by this demo page.</span>
            </div>

            <a href="login.html" class="back-link">
                <i class="bi bi-arrow-left me-1"></i> Back to login
            </a>
        </section>
    </main>

    <footer>Â© 2026 RentInstead. Access instead of ownership.</footer>

    <script>
        document.getElementById("resetForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const phone = document.getElementById("phone").value.trim();
            const message = document.getElementById("message");

            message.style.display = "block";

            if (!/^[6-9][0-9]{9}$/.test(phone)) {
                message.className = "message alert alert-danger";
                message.textContent = "Please enter a valid 10-digit Indian mobile number.";
                return;
            }

            message.className = "message alert alert-info";
            message.textContent =
                "Number format is valid. Actual OTP delivery and password reset will be enabled after backend integration.";
        });
    </script>
</body>
</html>
